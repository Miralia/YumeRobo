name: Update yacomp-web

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update pinned viewer release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run update:yacomp

      - name: Verify update
        id: update
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            bun run check
            bun run build
          fi

      - name: Create update pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-yacomp-web
          delete-branch: true
          commit-message: "chore(deps): update yacomp-web"
          title: "chore(deps): update yacomp-web"
          body: |
            Updates the embedded viewer to the latest stable yacomp-web release.

            The release manifest and SHA-256 are validated before the pinned,
            same-origin asset is replaced. Type checking and a production build
            have completed successfully.
