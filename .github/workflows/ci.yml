name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `check` covers both the SvelteKit app and the CLI (scripts/tsconfig.json),
      # because the CLI is plain TypeScript that svelte-check never sees.
      - name: Type check
        run: bun run check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
