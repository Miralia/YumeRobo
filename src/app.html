<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f1f4" />
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c12" />
	<link rel="icon" href="/favicon.ico" sizes="32x32">
	<link rel="icon" href="/icon.svg" type="image/svg+xml">
	<link rel="preload" href="/fonts/source-sans-3-latin.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="/fonts/ibm-plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
	<script>
		// Stamp the saved theme override before first paint to avoid a
		// wrong-theme flash; "auto" leaves the attribute off so the
		// prefers-color-scheme tokens apply.
		try {
			var yumeTheme = localStorage.getItem('theme');
			if (yumeTheme === 'light' || yumeTheme === 'dark') {
				document.documentElement.setAttribute('data-theme', yumeTheme);
			}
		} catch (e) { }
	</script>

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
